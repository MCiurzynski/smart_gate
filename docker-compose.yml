services:
  db:
    image: postgres:18.4-bookworm
    container_name: postgres_sg
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: p4ssw0rd
      POSTGRES_DB: sg_db
    ports:
      - "5432:5432"
    restart: on-failure:5
    volumes:
      - postgres_data:/var/lib/postgresql
  
  detector:
    build:
      context: detector
      dockerfile: Dockerfile
    env_file: "detector/.env"
    volumes:
      - type: bind
        source: detector/data
        target: /app/data
        read_only: true
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # depends_on:
    #   - db

volumes:
  postgres_data:
